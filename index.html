const PARTS=[{"key": "innen", "label": "Innengewinde", "start": 0, "z": 1, "bbox": [900, 6100, 6200, 5000], "paths": ["M6144 10100l-2744 0 -248 -143 -561 0 -468 -468 -1112 0 0 1494 5133 0 0 -883zm0 -3025l0 -883 -5133 0 0 1494 1112 0 468 -468 561 0 248 -143 2744 0z"]}, {"key": "aussen", "label": "Konisches Außengewinde", "start": 1800, "z": 2, "bbox": [8550, 6100, 4000, 5000], "paths": ["M10851 7046l-2042 128 -189 189 0 210 137 137 3348 0 0 -1493 -1254 0 0 829zm1254 2420l-3348 0 -137 137 0 210 189 189 2042 128 0 829 1254 0 0 -1493z"]}];
const stage=document.getElementById('stage');
const state={};
for(const p of PARTS) state[p.key]={x:p.start};

function pxPerUnit(){return stage.clientWidth/VIEW[2]}
function updateVisuals(){
 const s=pxPerUnit();
 for(const p of PARTS){
   document.getElementById('layer-'+p.key).style.transform=`translateX(${state[p.key].x*s}px)`;
   const [x,y,w,h]=p.bbox; const hit=document.getElementById('hit-'+p.key);
   hit.style.left=((x-VIEW[0]+state[p.key].x)*s)+'px'; hit.style.top=((y-VIEW[1])*s)+'px';
   hit.style.width=(w*s)+'px'; hit.style.height=(h*s)+'px';
 }
}

// Hidden collision masks. Only the #94E8B0 fill paths are drawn. No stroke is drawn.
// Therefore the collision boundary is the vector path itself, i.e. the centreline of Corel's centred outline.
const CW=1400, CH=Math.round(CW*VIEW[3]/VIEW[2]);
const sx=CW/VIEW[2], sy=CH/VIEW[3];
const masks={};
for(const p of PARTS){
 const c=document.createElement('canvas'); c.width=CW;c.height=CH; const ctx=c.getContext('2d',{willReadFrequently:true});
 ctx.setTransform(sx,0,0,sy,-VIEW[0]*sx,-VIEW[1]*sy); ctx.fillStyle='#000';
 for(const d of p.paths) ctx.fill(new Path2D(d),'evenodd');
 const dat=ctx.getImageData(0,0,CW,CH).data; const m=new Uint8Array(CW*CH);
 for(let i=0,j=3;i<m.length;i++,j+=4) m[i]=dat[j]>127?1:0;
 masks[p.key]=m;
}
function collides(key,newX){
 const a=masks[key], shiftA=Math.round(newX*sx);
 for(const q of PARTS){if(q.key===key) continue;
   const b=masks[q.key], shiftB=Math.round(state[q.key].x*sx);
   // scan common canvas rows; compare shifted source indices
   const d=shiftA-shiftB;
   const x0=Math.max(0,-shiftA,-shiftB); // harmless conservative bounds below replaced
   for(let y=0;y<CH;y++){
     const row=y*CW;
     // screen x where both shifted masks can exist
     const lo=Math.max(0,shiftA,shiftB), hi=Math.min(CW,CW+shiftA,CW+shiftB);
     for(let x=lo;x<hi;x++){
       if(a[row+x-shiftA] && b[row+x-shiftB]) return true;
     }
   }
 } return false;
}
function tryMove(key,target){
 const old=state[key].x; if(target===old)return;
 if(!collides(key,target)){state[key].x=target;return;}
 // Walk toward target in small increments to stop immediately at material contact.
 const dir=Math.sign(target-old), step=5; let x=old;
 while(Math.abs(target-x)>step){const n=x+dir*step;if(collides(key,n))break;x=n;}
 state[key].x=x;
}
let drag=null;
for(const p of PARTS){
 const hit=document.getElementById('hit-'+p.key);
 hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);drag={key:p.key,startClient:e.clientX,startX:state[p.key].x,hit};hit.classList.add('dragging');document.getElementById('status').textContent=p.label+' wird verschoben';});
 hit.addEventListener('pointermove',e=>{if(!drag||drag.key!==p.key)return;e.preventDefault();const du=(e.clientX-drag.startClient)/pxPerUnit();tryMove(p.key,drag.startX+du);updateVisuals();});
 const end=e=>{if(!drag||drag.key!==p.key)return;drag.hit.classList.remove('dragging');drag=null;document.getElementById('status').textContent='Bereit';};
 hit.addEventListener('pointerup',end);hit.addEventListener('pointercancel',end);
}
document.getElementById('reset').onclick=()=>{for(const p of PARTS)state[p.key].x=p.start;updateVisuals();document.getElementById('status').textContent='Bereit';};
window.addEventListener('resize',updateVisuals);updateVisuals();
</script></main></body></html>
